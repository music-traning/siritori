<!doctype html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <!-- Favicon (ファビコン) -->
    <link rel="icon" type="image/png" href="/favicon.png" />
    <!-- スマホでホーム画面に追加した時のアイコン用（余裕があれば同じ画像をapple-touch-icon.pngにしてpublicに入れておくと綺麗です） -->
    <link rel="apple-touch-icon" href="/favicon.png" />

    <!-- 基本情報 -->
    <title>レンズしりとりオンライン</title>
    <meta name="description" content="AIと一緒に、みんなで写真しりとり！スマホのカメラを使ってオンラインで遊べるブラウザパーティゲームです。" />

    <!-- OGP (Facebook, LINE, Slack などのシェア用) -->
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://siritori-zeta.vercel.app/" />
    <meta property="og:title" content="レンズしりとりオンライン" />
    <meta property="og:description" content="AIと一緒に、みんなで写真しりとり！スマホのカメラを使ってオンラインで遊べるブラウザパーティゲームです。" />
    <meta property="og:site_name" content="レンズしりとりオンライン" />
    <!-- ⚠️ OGPの画像URLは「https://〜」から始まる絶対パスにする必要があります -->
    <meta property="og:image" content="https://siritori-zeta.vercel.app/ogp.png" />

    <!-- Twitter(X) カード設定 -->
    <!-- summary_large_image にすると、画像が大きく目立つ形でシェアされます -->
    <meta name="twitter:card" content="summary_large_image" />
    <!-- ↓ もし公式アカウントがあれば @XXXX を入れます。なければこの1行は消してOKです -->
    <meta name="twitter:site" content="@UnitedMake" /> 
    <meta name="twitter:title" content="レンズしりとりオンライン" />
    <meta name="twitter:description" content="AIと一緒に、みんなで写真しりとり！スマホのカメラを使ってオンラインで遊べるブラウザパーティゲームです。" />
    <meta name="twitter:image" content="https://siritori-zeta.vercel.app/ogp.png" />
    <!-- Google Fonts: Zen Maru Gothic -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Zen+Maru+Gothic:wght@400;500;700;900&display=swap" rel="stylesheet">
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
